<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">


    <h:head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Aufgaben</title>
    </h:head>

    <h:body onload="#{userBean.loadScoreboard()}">
        <h:outputStylesheet library = "css" name = "RankingStyle.css"  />    

        <h:form id="RankingscreenForm"> 

            <p:dataTable var="user" value="#{userBean.userByScore}" rowIndexVar="index">
                <p:column headerText="Pos">
                    <h:outputText value="#{index + 1}"/>
                </p:column>
                <p:column headerText="Email">
                    <h:outputText value="#{user.email}" />
                </p:column>

                <p:column headerText="Vorname">
                    <h:outputText value="#{user.name}" />
                </p:column>

                <p:column headerText="Name">
                    <h:outputText value="#{user.lastName}" />
                </p:column>

                <p:column headerText="Team">
                    <h:outputText value="#{user.team.name}" />
                </p:column>

                <p:column headerText="Score">
                    <h:outputText value="#{user.score}" />
                </p:column>
            </p:dataTable>

        </h:form>


    </h:body>
</html>
